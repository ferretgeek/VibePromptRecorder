name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 开发文件夹
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: 开发文件夹/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify requirements and assets
        run: pnpm trace:check && pnpm audit:fonts && pnpm audit:schema
      - name: Verify web application
        run: pnpm lint && pnpm typecheck && pnpm test && pnpm build:web
      - name: Verify Rust core
        run: pnpm verify:rust
