[package]
name = "vibe-prompt-recorder"
version = "0.1.4"
description = "本地离线的 Vibe Coding 提示词记录工具"
authors = ["ferretgeek"]
edition = "2024"
rust-version = "1.95"

[lib]
name = "vibe_prompt_recorder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
base64 = "0.22.1"
fs2 = "0.4.3"
parking_lot = "0.12.5"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "native-tls"] }
rusqlite = { version = "0.40.1", features = ["bundled", "backup", "functions", "hooks"] }
rfd = "0.16.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
skrifa = "0.45.1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
wuff = "0.2.8"
zip = { version = "8.2.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
